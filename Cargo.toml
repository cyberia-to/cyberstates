[package]
name = "cyberstates"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_meta = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement", "HtmlDivElement", "EventTarget", "Location", "Element", "NodeList", "MouseEvent", "SvgElement", "CssStyleDeclaration", "HtmlElement", "Storage", "History", "PopStateEvent", "DomRect"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "cyberstates"
path = "src/main.rs"

[[bin]]
name = "fetch-visa-data"
path = "src/bin/fetch_visa_data.rs"
required-features = ["tools"]

[[bin]]
name = "scrape-passportindex"
path = "src/bin/scrape_passportindex.rs"
required-features = ["scraper"]

[[bin]]
name = "import-visa-json"
path = "src/bin/import_visa_json.rs"
required-features = ["tools"]

[dependencies.reqwest]
version = "0.12"
features = ["blocking"]
optional = true

[dependencies.headless_chrome]
version = "1.0"
optional = true

[features]
default = []
tools = ["reqwest"]
scraper = ["headless_chrome"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
