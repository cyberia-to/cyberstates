# Reference vhost for cyberstates.net — deploy path: /var/www/html/cyberstates/
# After prerender, dist/nginx-redirects.conf is included for code→slug 301s.
# lytics proxy: include after rsync/deploy of lytics.service on cyberproxy.

server {
    server_name cyberstates.net www.cyberstates.net;

    root /var/www/html/cyberstates/;
    index index.html;

    location /.well-known {
        root /var/www/html/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # lytics dashboard + API (strip /lytics prefix → ingest on :8091)
    location = /lytics {
        return 301 /lytics/;
    }
    location /lytics/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fleets & flats console moved to cyberia.my
    location = /cyberia {
        return 301 https://cyberia.my/;
    }
    location = /cyberia/ {
        return 301 https://cyberia.my/;
    }

    # Prefer exact files (and …/index.html) without forcing a trailing slash.
    location ^~ /state/ {
        try_files $uri $uri/index.html =404;
    }
    location ^~ /token/ {
        try_files $uri $uri/index.html =404;
    }
    location ^~ /from/ {
        try_files $uri $uri/index.html =404;
    }

    include /var/www/html/cyberstates/nginx-redirects.conf;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cyberstates.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberstates.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.cyberstates.net) {
        return 301 https://$host$request_uri;
    }
    if ($host = cyberstates.net) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name cyberstates.net www.cyberstates.net;
    return 404;
}
